<VirtualHost *:${PORT}>
    DocumentRoot /var/www/app
    <Directory /var/www/app>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # Código del servidor, SQL, pruebas y archivos internos: nunca accesibles desde la web.
    <DirectoryMatch "^/var/www/app/(servidor|docs|\.git)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(^\.|\.(sql|sh|md|conf)$|^Dockerfile$)">
        Require all denied
    </FilesMatch>
    <Files "_init.php">
        Require all denied
    </Files>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
    # Detrás del balanceador de Cloud Run, la IP real del usuario viene en X-Forwarded-For.
    RemoteIPHeader X-Forwarded-For
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
