name: Publicar en GitHub Pages

on:
  push:
    # main y la rama principal actual del repositorio (GitHub Pages publica desde la rama principal).
    branches: [main, ccr-0c4907b3-s710t3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages solo publica la app (sin servidor). El código PHP, SQL y pruebas no se suben.
      - name: Preparar archivos públicos
        run: bash servidor/publicar-estatico.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
