name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages solo publica la app (sin servidor). El código PHP, SQL y pruebas no se suben.
      - name: Preparar archivos públicos
        run: |
          mkdir _site
          cp -r index.html styles.css app.js gs1.js importar.js bitacora.js desplegable.js sw.js manifest.webmanifest icons vendor ejemplo-pedido.* .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
