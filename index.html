<!doctype html>
<html lang="es" data-theme="menta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Revisión">
  <title>Revisión de Pedidos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try {
      var t = localStorage.getItem('revision-tema');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'grafito' : 'menta';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnHome" title="Inicio" aria-label="Inicio">⌂</button>
    <h1 id="title">Revisión de Pedidos</h1>
    <button class="icon-btn" id="btnTheme" title="Colores" aria-label="Cambiar colores">🎨</button>
  </header>

  <main id="app">
    <!-- INICIO -->
    <section id="view-home" class="view">
      <div class="bento">
        <button class="tile t1 span2 tall cta" id="btnNewOrder">
          <span class="tile-icon">＋</span>
          <span class="tile-big">Cargar pedido</span>
          <span class="tile-sub">Desde Excel, CSV o a mano (central)</span>
        </button>
        <label class="tile t2 cta">
          <span class="tile-icon">📂</span>
          <span class="tile-title">Abrir archivo de pedido</span>
          <span class="tile-sub">Archivo .pedido recibido</span>
          <input type="file" id="fileOpenOrder" accept=".json,.pedido" hidden>
        </label>
        <div class="tile t3" id="statCounting"></div>
        <div class="tile t4" id="statDone"></div>
        <div class="tile t5" id="statDiff"></div>
      </div>
      <h2 class="section-h">Pedidos recientes</h2>
      <div id="orderList" class="order-grid"></div>
    </section>

    <!-- CARGA DEL PEDIDO (CENTRAL) -->
    <section id="view-load" class="view" hidden>
      <div class="card">
        <h2>1. Datos del pedido</h2>
        <div class="grid2">
          <label>Nombre / N° de pedido
            <input id="orderName" placeholder="Ej: Pedido 1052">
          </label>
          <label>Sucursal
            <input id="orderBranch" placeholder="Ej: Sucursal Centro">
          </label>
        </div>
      </div>

      <div class="card">
        <h2>2. Productos</h2>
        <p class="muted">Sube el Excel o CSV del pedido. Columnas reconocidas: <b>código</b> (de barras), <b>producto</b>, <b>lote</b>, <b>precio</b>, <b>cantidad</b> y opcional <b>vencimiento</b>.</p>
        <div class="row gap">
          <label class="btn primary">
            📄 Subir Excel / CSV
            <input type="file" id="fileExcel" accept=".xlsx,.xls,.csv,.txt" hidden>
          </label>
          <button class="btn" id="btnPaste">📋 Pegar desde Excel</button>
          <a class="btn" href="ejemplo-pedido.csv" download>⬇ Plantilla de ejemplo</a>
        </div>

        <div id="pasteBox" hidden>
          <textarea id="pasteArea" rows="6" placeholder="Copia las filas en Excel (con encabezados) y pégalas aquí"></textarea>
          <button class="btn primary" id="btnPasteApply">Agregar filas pegadas</button>
        </div>

        <details class="manual">
          <summary>Agregar producto a mano</summary>
          <form id="manualForm" class="grid-manual">
            <input name="codigo" placeholder="Código de barras" inputmode="numeric">
            <input name="producto" placeholder="Producto *" required>
            <input name="lote" placeholder="Lote">
            <input name="precio" placeholder="Precio" inputmode="decimal">
            <input name="cantidad" placeholder="Cantidad *" inputmode="numeric" required>
            <input name="vencimiento" placeholder="Vencimiento">
            <button class="btn primary">Agregar</button>
          </form>
        </details>

        <div id="loadPreview"></div>
      </div>

      <div class="sticky-actions">
        <button class="btn primary big" id="btnSaveOrder">💾 Guardar pedido</button>
      </div>
    </section>

    <!-- DETALLE DEL PEDIDO / ENVÍO -->
    <section id="view-order" class="view" hidden>
      <div class="bento">
        <div class="tile t0 span4">
          <span class="tile-kicker" id="orderMeta"></span>
          <span class="tile-big" id="orderTitle"></span>
        </div>
        <button class="tile accent span2 tall cta" id="btnStartCount">
          <span class="tile-icon">📦</span>
          <span class="tile-big">Contar pedido</span>
          <span class="tile-sub" id="orderProgress"></span>
        </button>
        <button class="tile t1 cta" id="btnShowResults">
          <span class="tile-icon">📊</span>
          <span class="tile-title">Ver diferencias</span>
          <span class="tile-sub">Al terminar el conteo</span>
        </button>
        <button class="tile t2 cta" id="btnShareLink">
          <span class="tile-icon">🔗</span>
          <span class="tile-title">Enviar a sucursal</span>
          <span class="tile-sub">Enlace por WhatsApp o correo</span>
        </button>
        <button class="tile t3 cta" id="btnDownloadOrder">
          <span class="tile-icon">⬇</span>
          <span class="tile-title">Descargar archivo</span>
          <span class="tile-sub">Para enviar como adjunto</span>
        </button>
        <button class="tile t4 cta" id="btnDeleteOrder">
          <span class="tile-icon">🗑</span>
          <span class="tile-title">Eliminar</span>
          <span class="tile-sub">Borra pedido y conteo</span>
        </button>
      </div>
      <p class="small muted center" id="shareInfo"></p>
    </section>

    <!-- CONTEO (SUCURSAL) -->
    <section id="view-count" class="view" hidden>
      <div class="count-head">
        <div class="progress-row">
          <div class="progress"><div class="bar" id="progressBar"></div></div>
          <span class="small" id="progressText"></span>
        </div>
        <div class="search-row">
          <input type="search" id="search" placeholder="🔎 Buscar producto, código o lote" autocomplete="off">
          <button class="btn primary" id="btnScan" title="Escanear con cámara">📷 Escanear</button>
        </div>
        <div class="row gap small-gap">
          <label class="inline small">Unidades por escaneo
            <input type="number" id="scanQty" value="1" min="1" class="tiny">
          </label>
          <label class="inline small"><input type="checkbox" id="onlyPending"> Solo sin contar</label>
          <button class="btn small" id="btnUndo">↶ Deshacer</button>
        </div>
      </div>

      <div id="scanner" hidden>
        <div id="reader"></div>
        <p class="small" id="scanStatus">Apunta al código de barras…</p>
        <div class="row gap">
          <button class="btn" id="btnTorch" hidden>🔦 Linterna</button>
          <button class="btn" id="btnStopScan">Cerrar cámara</button>
        </div>
      </div>

      <div id="toast" class="toast" hidden></div>
      <ul id="countList" class="items"></ul>
      <div id="extrasBox"></div>

      <div class="sticky-actions">
        <button class="btn" id="btnAddExtra">＋ No está en la lista</button>
        <button class="btn primary big" id="btnFinish">✅ Terminé, ver diferencias</button>
      </div>
    </section>

    <!-- RESULTADOS -->
    <section id="view-results" class="view" hidden>
      <div id="summary" class="bento"></div>
      <div class="toolbar">
        <label class="inline small"><input type="checkbox" id="onlyDiffs" checked> Solo con diferencias</label>
        <div class="row gap">
          <button class="btn" id="btnExportXlsx">⬇ Excel</button>
          <button class="btn" id="btnExportCsv">⬇ CSV</button>
          <button class="btn" id="btnPrint">🖨 Imprimir</button>
          <button class="btn primary" id="btnShareResults">📤 Compartir</button>
          <button class="btn" id="btnBackToCount">↩ Volver al conteo</button>
        </div>
      </div>
      <div id="resultsTable"></div>
    </section>
  </main>

  <!-- Diálogo genérico -->
  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <h3 id="dlgTitle"></h3>
      <div id="dlgBody"></div>
      <div class="row gap end" id="dlgActions"></div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="gs1.js"></script>
  <script src="app.js"></script>
</body>
</html>
